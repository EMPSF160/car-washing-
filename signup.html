<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Join HydroShine Revolution</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                            950: '#022c22'
                        },
                        titanium: {
                            800: '#151d2a',
                            850: '#0f1724',
                            900: '#0b111b',
                            950: '#070a10'
                        },
                        neon: {
                            emerald: '#00F090',
                            glow: '#10B981'
                        }
                    },
                    fontFamily: { sans: ['Inter','sans-serif'], outfit: ['Outfit','sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-[#070A10] text-slate-900 dark:text-white font-sans antialiased">
    <!-- Floating Toggles -->
    <div class="fixed top-6 right-6 md:top-8 md:right-8 flex items-center gap-3 z-50">
        <button id="theme-toggle" class="p-2 rounded-full text-slate-900 dark:text-white hover:bg-emerald-100 dark:hover:bg-emerald-900/30 transition-all">
            <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
            <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
        </button>
        <button id="rtl-toggle" class="p-2 text-[10px] font-black uppercase text-slate-900 dark:text-white hover:text-emerald-500 transition-colors">RTL</button>
    </div>

    <div class="pt-24 pb-12 w-full flex items-center justify-center min-h-screen p-4 md:p-6 overflow-y-auto relative">
        <div class="w-full max-w-2xl bg-white dark:bg-[#0F1724] p-8 md:p-14 rounded-[2.5rem] shadow-2xl border border-slate-200 dark:border-emerald-500/20 relative overflow-hidden text-center mx-auto transition-all duration-500 group/card">
        <!-- Form Column -->
        <div class="space-y-8 md:space-y-12">
            <div class="text-center">
                <div class="space-y-4">
                    <a href="index.html" class="inline-flex items-center gap-4 group justify-center">
                        <img src="assets/images/logo.png" alt="HydroShine Logo" class="w-14 h-14 md:w-16 md:h-16 object-contain group-hover:scale-110 transition-transform">
                        <span class="text-2xl md:text-3xl font-outfit font-black uppercase tracking-widest text-emerald-500 dark:text-[#00F090]">HydroShine</span>
                    </a>
                    <h2 class="text-xl md:text-2xl font-outfit font-black text-slate-900 dark:text-white uppercase leading-tight">Start Your <br><span class="text-emerald-500 dark:text-[#00F090] italic">Legacy.</span></h2>
                    <p class="text-gray-400 font-medium max-w-sm mx-auto text-sm md:text-base">Join the exclusive circle of sustainable luxury car owners.</p>
                </div>
            </div>

            <form action="login.html" class="space-y-4 md:space-y-5">
                <div class="space-y-4 md:space-y-5">
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black uppercase tracking-widest text-emerald-900 dark:text-emerald-400 opacity-50 block w-full text-left">First Name</label>
                        <div class="relative group text-left">
                            <input type="text" placeholder="" required class="w-full px-8 py-2 md:py-3 bg-white dark:bg-black rounded-[1.2rem] border-2 border-emerald-100 dark:border-emerald-800 focus:border-emerald-500 focus:outline-none transition-all placeholder:text-gray-400/50">
                        </div>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black uppercase tracking-widest text-emerald-900 dark:text-emerald-400 opacity-50 block w-full text-left">Last Name</label>
                        <div class="relative group text-left">
                            <input type="text" placeholder="" required class="w-full px-8 py-2 md:py-3 bg-white dark:bg-black rounded-[1.2rem] border-2 border-emerald-100 dark:border-emerald-800 focus:border-emerald-500 focus:outline-none transition-all placeholder:text-gray-400/50">
                        </div>
                    </div>
                </div>
                <div class="space-y-4 md:space-y-5">
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black uppercase tracking-widest text-emerald-900 dark:text-emerald-400 opacity-50 block w-full text-left">Email Address</label>
                        <div class="relative group text-left">
                            <input type="email" placeholder="" required class="w-full px-8 py-2 md:py-3 bg-white dark:bg-black rounded-[1.2rem] border-2 border-emerald-100 dark:border-emerald-800 focus:border-emerald-500 focus:outline-none transition-all placeholder:text-gray-400/50">
                        </div>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black uppercase tracking-widest text-emerald-900 dark:text-emerald-400 opacity-50 block w-full text-left">Phone Number</label>
                        <div class="relative group text-left">
                            <input type="tel" placeholder="" required class="w-full px-8 py-2 md:py-3 bg-white dark:bg-black rounded-[1.2rem] border-2 border-emerald-100 dark:border-emerald-800 focus:border-emerald-500 focus:outline-none transition-all placeholder:text-gray-400/50">
                        </div>
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="text-[10px] font-black uppercase tracking-widest text-emerald-900 dark:text-emerald-400 opacity-50 block w-full text-left">Secure Password</label>
                    <div class="relative group text-left">
                        <input type="password" id="password" placeholder="" required class="w-full px-12 py-2 md:py-3 bg-white dark:bg-black rounded-[1.2rem] border-2 border-emerald-100 dark:border-emerald-800 focus:border-emerald-500 focus:outline-none transition-all placeholder:text-gray-400/50">
                        <button type="button" class="password-toggle absolute right-4 top-1/2 -translate-y-1/2 p-2 text-emerald-900/50 dark:text-emerald-400/50 hover:text-emerald-500 transition-colors z-10">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-start text-[10px] font-black uppercase tracking-widest text-gray-400 mt-2 mb-6">
                    <a href="#" class="hover:text-emerald-500 transition-colors underline decoration-emerald-500/30">Terms and Conditions</a>
                </div>

                <div class="space-y-6">
                    <button type="submit" class="w-full flex items-center justify-center py-3 md:py-4 bg-emerald-500 text-emerald-950 font-black text-base md:text-lg rounded-[1.2rem] transition-all shadow-2xl shadow-emerald-500/30 hover:scale-[1.05] hover:shadow-emerald-500/50 active:scale-95 uppercase">Create Exclusive Account</button>
                    <p class="text-[10px] text-gray-400 text-center uppercase tracking-widest font-bold leading-relaxed px-4">By signing up you agree to our <a href="#" class="text-emerald-500 underline decoration-emerald-500/30 underline-offset-4 hover:text-white hover:bg-emerald-500 hover:px-2 hover:py-1 hover:rounded-lg hover:no-underline hover:scale-110 active:scale-95 transition-all duration-300 inline-block font-black">Terms of Detailing</a></p>
                </div>
            </form>

            <p class="text-center text-sm font-bold text-gray-400 italic">Already in the circle? <a href="login.html" class="text-emerald-500 not-italic uppercase font-black hover:underline ml-2">Sign In</a></p>

            <div class="pt-8 border-t border-emerald-100 dark:border-white/40 flex flex-col items-center gap-6">
                <p class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-400">Quick Join</p>
                <div class="flex items-center gap-4">
                    <button class="w-12 h-12 flex items-center justify-center bg-emerald-50 dark:bg-emerald-800 rounded-2xl border border-emerald-100/50 dark:border-emerald-700 hover:bg-emerald-500 hover:text-emerald-950 transition-all group">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-500 group-hover:text-emerald-950 transition-colors">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </button>
                    <button class="w-12 h-12 flex items-center justify-center bg-emerald-50 dark:bg-emerald-800 rounded-2xl border border-emerald-100/50 dark:border-emerald-700 hover:bg-emerald-500 hover:text-emerald-950 transition-all group">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-500 group-hover:text-emerald-950 transition-colors">
                            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
                        </svg>
                    </button>
                    <button class="w-12 h-12 flex items-center justify-center bg-emerald-50 dark:bg-emerald-800 rounded-2xl border border-emerald-100/50 dark:border-emerald-700 hover:bg-emerald-500 hover:text-emerald-950 transition-all group">
                        <i data-lucide="apple" class="w-5 h-5 text-emerald-500 group-hover:text-emerald-950 transition-colors"></i>
                    </button>
                </div>
            </div>
            </div>
        </div>
    </div>
</div>





    <script src="assets/js/main.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
